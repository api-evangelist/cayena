name: Cayena
description: >-
  Cayena is a Brazilian B2B technology company operating an e-procurement
  marketplace and embedded-fintech platform for the food-service industry.
  It connects restaurants, bars, hotels, and other food-service buyers with
  food, beverage, and supply distributors, streamlining ordering, catalog
  discovery, and fulfillment while layering in payments and short-term credit
  (buy-now-pay-later) so operators can purchase supplies and defer payment.
  Headquartered in Sao Paulo, Cayena is backed by venture investors including
  Canaan Partners. This API Evangelist profile was surfaced as a portfolio
  company lead; no public developer API, OpenAPI, or developer portal has been
  confirmed for Cayena at the time of enrichment.
